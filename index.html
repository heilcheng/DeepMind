<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSoC 2025 / Google DeepMind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            deepmind: {
              DEFAULT: '#4285F4', // Google Blue
              dark: '#1a73e8',
              hover: '#E8F0FE', // Light blue background
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #ffffff;
      color: #3C4043;
    }

    /* Sidebar Layout */
    @media (min-width: 1024px) {
      .layout-container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        width: 280px;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid #e5e7eb;
      }

      .main-content {
        grid-column-start: 2;
        max-width: 900px;
        margin: 0 auto;
        padding-top: 4rem;
      }
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 0 24px 24px 0;
      color: #5f6368;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s;
      margin-right: 16px;
    }

    .nav-link:hover {
      background-color: #E8F0FE;
      color: #1a73e8;
    }

    .nav-link.active {
      background-color: #E8F0FE;
      color: #1a73e8;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      background: white;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: #4285F4;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.1);
    }

    .topic-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #1967d2;
      background: #e8f0fe;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>

<body class="antialiased">

  <div class="layout-container">

    <!-- Sidebar -->
    <aside class="sidebar bg-white p-6 flex flex-col justify-between z-50">
      <div>
        <div class="mb-10 px-4">
          <p class="text-xs font-medium text-deepmind uppercase tracking-widest mb-1">GSoC 2025</p>
          <h1 class="text-xl font-bold text-gray-900 leading-tight">Google<br>DeepMind</h1>
        </div>

        <nav class="space-y-1">
          <a href="#about" class="nav-link">
            <span>About</span>
          </a>
          <a href="#timeline" class="nav-link">
            <span>Timeline</span>
          </a>
          <a href="#blog" class="nav-link">
            <span>Blog</span>
          </a>
          <a href="#projects" class="nav-link">
            <span>Projects</span>
          </a>
          <a href="#documents" class="nav-link">
            <span>Documents</span>
          </a>
          <a href="#resources" class="nav-link">
            <span>Resources</span>
          </a>
        </nav>
      </div>

      <div class="px-4 mt-8">
        <div class="pt-6 border-t border-gray-100 flex flex-col gap-3">
          <a href="https://github.com/heilcheng/DeepMind" target="_blank"
            class="text-sm text-gray-500 hover:text-deepmind transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path

            </svg>
            Source Code
          </a>
          <a href="https://haileycheng.com"
            class="text-sm text-gray-500 hover:text-deepmind transition-colors">haileycheng.com</a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content px-6 py-12 lg:py-0 pb-24">

      <!-- About/Intro -->
      <section id="about" class="mb-20 pt-8 lg:pt-20">
        <h1 class="text-4xl lg:text-5xl font-bold tracking-tight text-gray-900 mb-6">
          Work at <span class="text-deepmind">Google DeepMind</span>
        </h1>
        <p class="text-xl text-gray-600 max-w-2xl leading-relaxed">
          Building open-source evaluation tools for large language models on the Gemma project. Developed systematic
          benchmarking and domain-specific assessment frameworks.
        </p>
  </div>
  </footer>

</body>

</html>
